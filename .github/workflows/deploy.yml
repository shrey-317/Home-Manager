name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish before anything is merged, which is how you get a URL to install from.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a running one, or Pages can be left half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/espresso
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/espresso/package-lock.json
      - run: npm ci
      - name: Build
        # A project Pages site is served from /<repo>/, and the app's base path, router basename
        # and manifest scope all derive from this one value. Getting it wrong yields a blank
        # installed app, so it is passed explicitly rather than assumed.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: SPA fallback
        # Pages serves static files, so a deep link like /Home-Manager/beans would 404 on
        # refresh. Serving index.html as the 404 page hands those URLs back to the router.
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/espresso/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
